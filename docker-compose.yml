version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: hexai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hexai_network

  redis:
    image: redis:6.2-alpine
    container_name: hexai_redis
    restart: always
    command: redis-server --appendonly yes --requirepass hexai_redis_secure
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - hexai_network

  n8n:
    image: n8nio/n8n:latest
    container_name: hexai_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://${N8N_HOST}:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    networks:
      - hexai_network

  evolution_api:
    image: atendai/evolution-api:v2.1.1
    container_name: hexai_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - LOG_LEVEL=ERROR
      # Database
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Redis
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:hexai_redis_secure@redis:6379/0
      - REDIS_PASSWORD=hexai_redis_secure
      # WebSocket
      - WEBSOCKET_ENABLED=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      - postgres
      - redis
    networks:
      - hexai_network

volumes:
  postgres_data:
  n8n_data:
  redis_data:
  evolution_instances:
  evolution_store:


networks:
  hexai_network:
    driver: bridge
